name: siapnikah wp-cron ping
# Memicu WP-Cron siapnikah.id tiap ±15 menit agar artikel otomatis
# tetap terbit walau situs belum ada pengunjung.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger wp-cron.php
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
            -A "siapnikah-cron-bot" \
            "https://siapnikah.id/wp-cron.php?doing_wp_cron=$(date +%s)")
          echo "HTTP $code"
          test "$code" -lt 500
