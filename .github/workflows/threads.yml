name: siapnikah threads
# Posting teks Threads 5x sehari: 07:00, 10:00, 13:00, 17:00, 21:00 WIB.
# Jadwal GitHub sering telat, jadi run cadangan wp-cron.yml juga memicu
# workflow ini tiap 15 menit bila ada item jatuh tempo.
on:
  schedule:
    - cron: "4 0 * * *"    # 07:04 WIB
    - cron: "4 3 * * *"    # 10:04 WIB
    - cron: "4 6 * * *"    # 13:04 WIB
    - cron: "4 10 * * *"   # 17:04 WIB
    - cron: "4 14 * * *"   # 21:04 WIB
  workflow_dispatch: {}
concurrency:
  group: threads
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post next due Threads text
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ vars.THREADS_USER_ID }}
        run: python3 scripts/threads_post.py
      - name: Save state
        if: always()
        run: |
          git config user.name "siapnikah-bot"
          git config user.email "bot@siapnikah.id"
          git add -A threads
          git diff --cached --quiet || (git commit -m "threads: $(date -u +%FT%TZ)" && git pull --rebase -q && git push)
